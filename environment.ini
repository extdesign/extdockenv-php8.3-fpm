; Unified PHP settings for both CLI and FPM in official php-fpm image.
date.timezone=Europe/Moscow
display_errors=Off
log_errors=On
error_reporting=E_ALL

; Maximum amount of memory a script may consume
memory_limit=768M
; Maximum allowed size for uploaded files
upload_max_filesize=128M
; Sets max size of post data allowed
post_max_size=136M
; Должно быть МЕНЬШЕ fastcgi_read_timeout в nginx, чтобы PHP успел вернуть ответ до того,
; как nginx оборвёт соединение с 504. Для долгих операций — поднимать оба.
max_execution_time=300

opcache.enable=1
opcache.enable_cli=0
; проверять раз в минуту, компромисс между производительностью и актуальностью кода
; opcache.revalidate_freq=0 - требует Bitrix при проверке
opcache.revalidate_freq=60
opcache.validate_timestamps=1
opcache.memory_consumption=512
opcache.max_accelerated_files=100000
opcache.fast_shutdown=1
opcache.force_restart_timeout=60
opcache.file_update_protection=10

; JIT disabled for predictable behavior in mixed environments.
opcache.jit_buffer_size=0
opcache.jit=0

pcre.jit=0
realpath_cache_size=4096k
max_input_vars=10000
short_open_tag=On
session.gc_probability=1

; /usr/sbin/sendmail -t -i -f www@my.domain.com
sendmail_path=/usr/bin/msmtp -t -i
